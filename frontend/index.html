<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- 1. Navbar -->
    <nav class="navbar bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img
            src="images/Expenses_Logo.png"
            alt="Logo"
            width="35"
            height="35"
            class="d-inline-block align-text-top"
          />
          <strong><span class="text-warning">Expenses</span> Tracker</strong>
        </a>
      </div>
    </nav>

    <div class="container-fluid px-4 my-3">
      <!-- Spinner -->
      <div
        class="d-flex justify-content-center my-4 visually-hidden"
        id="loadingSpinner"
      >
        <div class="spinner-border text-warning" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
      
      <!-- Alert -->
      <div
        class="alert alert-danger visually-hidden"
        role="alert"
        id="errorAlert"
      ></div>

      <!-- 2. Summary cards -->
      <div class="row row-cols-1 row-cols-md-3 g-4 mt-1 mb-4">
        <div class="col">
          <div class="card h-100 custom-card-shadow border-0 rounded-4">
            <img
              src="images/sum_icon.png"
              class="card-img-top object-fit-contain summary-icon mx-auto d-block mt-3"
              alt="..."
            />
            <div class="card-body">
              <h6 class="card-title text-center mb-1 text-muted fw-semibold">
                Total Amount
              </h6>
              <p
                class="card-text text-center fs-5 fw-bold text-success mb-0"
                id="card1"
              ></p>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="card h-100 custom-card-shadow border-0 rounded-4">
            <img
              src="images/Count_icon.png"
              class="card-img-top object-fit-contain summary-icon mx-auto d-block mt-3"
              alt="..."
            />
            <div class="card-body">
              <h6 class="card-title text-center mb-1 text-muted fw-semibold">
                Number of Expenses
              </h6>
              <p
                class="card-text text-center fs-5 fw-bold text-success mb-0"
                id="card2"
              ></p>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="card h-100 custom-card-shadow border-0 rounded-4">
            <img
              src="images/Highest_icon.png"
              class="card-img-top object-fit-contain summary-icon mx-auto d-block mt-3"
              alt="..."
            />
            <div class="card-body">
              <h6 class="card-title text-center mb-1 text-muted fw-semibold">
                Highest Expense
              </h6>
              <p
                class="card-text text-center fs-5 fw-bold text-success mb-0"
                id="card3"
              ></p>
            </div>
          </div>
        </div>
      </div>

      <!-- 3. Main Layout CSS Grid -->
      <div class="main-grid-layout mb-4">
        
        <!-- Form Column -->
        <div class="h-100">
          <div class="card shadow-sm border-0 rounded-4 p-4 h-100 d-flex flex-column">
            <h5 class="fw-bold mb-3 text-secondary">Add New Expense</h5>
            <form id="expensesForm" class="d-flex flex-column justify-content-between flex-grow-1">
              <div>
                <div class="mb-3">
                  <label for="title" class="form-label">Title</label>
                  <input type="text" class="form-control" id="title" required />
                </div>
                <div class="mb-3">
                  <label for="amount" class="form-label">Amount</label>
                  <input
                    type="number"
                    class="form-control"
                    id="amount"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="category" class="form-label">Category</label>
                  <select id="category" class="form-select" required>
                    <option>Food</option>
                    <option>Transport</option>
                    <option>Bills</option>
                    <option>Entertainment</option>
                    <option>Other</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="expenseDate" class="form-label">Expense Date</label>
                  <input
                    type="date"
                    class="form-control"
                    id="expenseDate"
                    required
                  />
                </div>
              </div>
              <button
                type="submit"
                class="btn btn-success w-100 rounded-3 py-2 mt-3"
              >
                Add Expense
              </button>
            </form>
          </div>
        </div>

        <!-- Table & Filter Column -->
        <div class="d-flex flex-column">
          <!-- Filter -->
          <div class="card shadow-sm border-0 rounded-4 p-3 mb-3">
            <label
              for="categoryFilter"
              class="form-label fw-semibold text-muted"
              >Filter by Category</label
            >
            <select id="categoryFilter" class="form-select">
              <option>All</option>
              <option>Food</option>
              <option>Transport</option>
              <option>Bills</option>
              <option>Entertainment</option>
              <option>Other</option>
            </select>
          </div>

          <!-- Table -->
          <div class="card shadow-sm border-0 rounded-4 overflow-hidden flex-grow-1">
            <div class="table-responsive">
              <table class="table align-middle mb-0">
                <thead>
                  <tr>
                    <th scope="col" class="ps-3">Title</th>
                    <th scope="col">Amount</th>
                    <th scope="col">Category</th>
                    <th scope="col">Date</th>
                    <th scope="col" class="pe-3">Actions</th>
                  </tr>
                </thead>
                <tbody id="tableBody"></tbody>
              </table>
            </div>
          </div>
        </div>

      </div>

      <!-- Editing Modal -->
      <div class="modal fade" id="editingModal" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Edit Expense</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <form id="editForm">
                <div class="mb-3">
                  <label for="editTitle" class="form-label">Title</label>
                  <input
                    type="text"
                    class="form-control"
                    id="editTitle"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="editAmount" class="form-label">Amount</label>
                  <input
                    type="number"
                    class="form-control"
                    id="editAmount"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="editCategory" class="form-label"
                    >Category</label
                  >
                  <select id="editCategory" class="form-select" required>
                    <option>Food</option>
                    <option>Transport</option>
                    <option>Bills</option>
                    <option>Entertainment</option>
                    <option>Other</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="editExpenseDate" class="form-label"
                    >Expense Date</label
                  >
                  <input
                    type="date"
                    class="form-control"
                    id="editExpenseDate"
                    required
                  />
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Close
              </button>
              <button type="button" class="btn btn-primary" id="saveEditBtn">
                Save changes
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
